<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Diamond Games · Final</title><style>/* {{styles}} */</style></head><body>
<main class="final-page" id="final-page">
 <header class="header"><button id="final-back" class="back" type="button" aria-label="Вернуться к установке бриллианта"><img src="{{asset:final-chevron.svg}}" width="32" height="32" alt=""></button><img class="logo" src="{{asset:final-logo.svg}}" width="93.0078" height="13" alt="LA VIVION"><span class="header-space" aria-hidden="true"></span></header>
 <div class="intro"><h1>Ваше кольцо обрело форму</h1><p>Рассмотрите каждую деталь — все получилось так, как вы и задумали.</p></div>
 <section id="final-model-area" class="model-area" aria-label="Готовое кольцо в 3D. Поверните пальцем или мышью." aria-busy="true"></section>
 <dl class="specifications"><div><dt>Огранка</dt><dd id="final-cut">Овал</dd></div><div><dt>Оправа</dt><dd id="final-mount">Halo</dd></div></dl>
 <form id="save-form" class="save-form"><h2>Хотите сохранить его?</h2><p>Мы отправим вам созданную конфигурацию, открытку с кольцом вашей мечты и похожие варианты из коллекции LA VIVION.</p>
  <label class="email-field"><span class="sr-only">Ваш e-mail</span><input id="final-email" type="email" name="email" placeholder="Ваш e-mail" autocomplete="email" required><span class="required" aria-hidden="true">*</span></label>
  <div class="consents"><label><input type="checkbox" name="privacy" required><span>Cогласия на обработку персональных данных</span></label><label><input type="checkbox" name="marketing"><span>Согласие на получение скидок и акций от бренда</span></label></div>
  <div class="actions"><button class="send" type="submit">Отправить</button><button id="download-ring" class="download" type="button" disabled><span>Скачать фото кольца</span><span class="download-icon" aria-hidden="true"><img class="arrow" src="{{asset:download-arrow.svg}}" width="7.20864" height="4.26723" alt=""><span class="download-lines"><img class="stem" src="{{asset:download-stem.svg}}" width="0.9375" height="9.51562" alt=""><img class="base" src="{{asset:download-base.svg}}" width="12" height="0.9375" alt=""></span></span></button></div>
  <p id="save-status" class="save-status" role="status"></p>
 </form>
</main><script id="final-catalog" type="application/json">{{final-catalog}}</script><script>/* {{game}} */</script></body></html>
