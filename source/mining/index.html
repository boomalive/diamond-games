<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:,">
  <title>Lavivion · Добудьте алмаз</title>
  <style>/* {{styles}} */</style>
</head>
<body>
  <main class="shell">
    <div class="screen-space" id="screen-space">
      <section class="game" id="game" aria-label="Добыча природного алмаза" data-stage="0">
        <header class="header">
          <button class="back" id="back" type="button" aria-label="Начать добычу заново" title="Начать заново">
            <img src="{{asset:chevron.svg}}" width="32" height="32" alt="">
          </button>
          <img class="logo" id="logo" src="{{asset:logo.svg}}" width="93.0078" height="13" alt="Lavivion">
          <span class="step">Шаг 1 из 5</span>
        </header>
        <div class="intro">
          <h1 id="title">Добудьте алмаз из кимберлита</h1>
          <p id="fact">Самым древним из датированных алмазов около 3,5 млрд лет — почти три четверти возраста Земли. Они появились задолго до первых динозавров.</p>
        </div>
        <div class="scene" id="scene">
          <img class="shadow" id="shadow" src="{{asset:shadow.svg}}" width="211.143" height="96.1803" alt="">
          <div class="floating-stone" id="floating-stone">
            <div class="stone-reaction" id="stone-reaction">
              <img class="stone" data-image="0" src="{{asset:rock-0.png}}" width="300" height="326" alt="Кимберлит с алмазом внутри" draggable="false">
              <img class="stone" data-image="1" src="{{asset:rock-1-overlay.png}}" width="300" height="326" alt="" draggable="false">
              <img class="stone" data-image="2" src="{{asset:rock-2.png}}" width="300" height="326" alt="" draggable="false">
              <img class="stone" data-image="3" src="{{asset:rock-3.png}}" width="300" height="326" alt="" draggable="false">
              <img class="stone" data-image="4" src="{{asset:diamond.png}}" width="300" height="326" alt="" draggable="false">
            </div>
            <div class="hint" id="hint" aria-hidden="true"></div>
          </div>
          <canvas class="effects" id="effects" aria-hidden="true"></canvas>
          <img class="pickaxe" id="pickaxe" src="{{asset:pickaxe.png}}" width="168.545" height="252.817" alt="" draggable="false">
          <button class="hit-target" id="hit" type="button" aria-label="Ударить киркой по центру камня. Осталось 4 удара" disabled></button>
        </div>
        <p class="prompt" id="prompt">Загружаю камень…</p>
        <div class="progress" id="progress-wrap">
          <div class="progress-track" id="progress" role="progressbar" aria-label="Алмаз освобождён" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
          <p id="progress-text">Алмаз открыт на 0%</p>
        </div>
        <button class="again" id="again" type="button" hidden>Повторить добычу</button>
        <span class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></span>
      </section>
    </div>
    <footer class="tools">
      <button id="restart" type="button" title="Начать заново">↻ <span>Заново</span></button>
      <span class="hit-counter" id="hit-counter">0 / 4 удара</span>
      <button id="sound" type="button" aria-pressed="false" title="Включить звук удара">♪ <span>Звук выкл.</span></button>
    </footer>
    <p class="keyboard-note">Нажми на камень или используй пробел</p>
    <noscript>Для игры включи JavaScript в браузере.</noscript>
  </main>
  <script>/* {{lottie}} */</script>
  <script id="hint-data" type="application/json">{{hint-data}}</script>
  <script>/* {{game}} */</script>
</body>
</html>
