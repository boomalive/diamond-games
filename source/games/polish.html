<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>LA VIVION · Огранка</title><style>/* {{styles}} */</style></head><body>
<article class="game" aria-label="Огранка алмаза">
 <header class="header"><button class="back" type="button" aria-label="Начать огранку заново"><img src="{{asset:chevron.svg}}" width="32" height="32" alt=""></button><img class="logo" src="{{asset:logo.svg}}" width="93.0078" height="13" alt="LA VIVION"><span class="step">Шаг 3 из 5</span></header>
 <div class="copy"><h1 id="title">ПРИДАЙТЕ КАМНЮ ФОРМУ</h1><p id="description">Огранщик рассчитывает будущую огранку бриллианта с помощью 3D-сканирования.</p></div>
 <section class="work-area" aria-label="Обработка алмаза">
  <div class="stone-wrap" id="stone-wrap">
   <canvas id="stone" width="600" height="600" tabindex="0" aria-label="Водите по камню, удерживая палец или кнопку мыши. Enter запускает демонстрацию."></canvas>
   <canvas id="effects" width="600" height="600" aria-hidden="true"></canvas>
   <div class="grinding-tool" id="brush" aria-hidden="true"><img id="diamond-disc" src="{{asset:diamond-disc.png}}" alt="" draggable="false"></div>
   <div class="shine" id="shine" aria-hidden="true"></div><div class="loading" id="loading">Подготавливаем камень…</div>
  </div>
  <div class="hint" id="hint"><span id="hint-text">Проведите пальцем<br>по камню</span></div>
 </section>
 <footer class="footer"><div id="progress-panel" class="progress-panel"><div class="progress" role="progressbar" aria-label="Огранка алмаза" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div id="progress-fill"></div></div><p id="progress-label">Алмаз огранён на 0%</p></div><button id="next" class="next" type="button" hidden>К УСТАНОВКЕ АЛМАЗА</button></footer>
 <div id="completion" hidden><button id="close-completion" type="button">Закрыть</button><button id="repeat" type="button">Повторить огранку</button></div>
 <p class="sr-only" id="announcement" aria-live="polite"></p>
</article>
<nav hidden aria-hidden="true"><button id="demo" type="button"><span id="demo-label">Показать анимацию</span></button><span id="round-label">1 / 3</span><button id="reset" type="button">Заново</button></nav>
<script id="stone-assets" type="application/json">{{stone-assets}}</script><script>/* {{game}} */</script>
</body></html>
