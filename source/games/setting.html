<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>LA VIVION · Вставка бриллианта</title><style>/* {{styles}} */</style></head><body>
<main class="game" id="setting-game" data-state="start" data-progress="0" aria-label="Вставка бриллианта в оправу">
 <header class="header"><button id="setting-back" class="back" type="button" aria-label="Вернуться к огранке"><img src="{{asset:setting-chevron.svg}}" width="32" height="32" alt=""></button><img class="logo" src="{{asset:setting-logo.svg}}" width="93.0079" height="13" alt="LA VIVION"><span class="step">Шаг 5 из 5</span></header>
 <div class="copy"><h1 id="setting-title">А теперь работа ювелира —<br>вставьте бриллиант в оправу</h1><p id="setting-description">В кольцах LA VIVION особое внимание уделено точности закрепки. Это важно для красоты и&nbsp;надежности в повседневной носке.</p></div>
 <section id="setting-play-area" class="play-area" aria-label="Игровая область установки бриллианта" data-integration="frames-v2" aria-busy="true"></section>
 <div class="prompt" id="setting-prompt">Удерживая бриллиант,<br>перетащите его в оправу</div>
 <div class="progress" id="setting-progress" role="progressbar" aria-label="Установка бриллианта" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="setting-progress-fill"></span></div>
 <button id="setting-next" class="next" type="button" hidden>ДАЛЕЕ</button>
 <span class="sr-only" id="setting-announcement" aria-live="polite"></span>
</main><script id="setting-rings" type="application/json">{{ring-catalog}}</script><script>/* {{game}} */</script></body></html>
